version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: community-postgres
    environment:
      POSTGRES_DB: community
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: community-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: