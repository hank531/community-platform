spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/community
    username: admin
    password: password123
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB       # 파일 하나당 최대 크기
      max-request-size: 100MB   # 한 번 요청의 전체 최대 크기

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  # OAuth2 클라이언트 키가 없으면 아래처럼 자동설정을 비활성화합니다
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

server:
  port: 8080

jwt:
  secret: mySecretKeyForJWTTokenGeneration12345678901234567890
  access-expiration: 3600000
  refresh-expiration: 1209600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.community: DEBUG

minio:
  endpoint: http://localhost:9000   # MinIO API 주소
  access-key: minioadmin
  secret-key: minioadmin
  bucket: community                 # 위에서 만든 버킷 이름